name: opensearch # the name of your ROCK
base: ubuntu@24.04 # the base environment for this ROCK
license: Apache-2.0

version: '2.19.4' # just for humans. Semantic versioning is recommended

summary: 'OpenSearch ROCK OCI.'
description: |
  OpenSearch is a community-driven, Apache 2.0-licensed open source search and 
  analytics suite that makes it easy to ingest, search, visualize, and analyze data. 
  Developers build with OpenSearch for use cases such as application search, 
  log analytics, data observability, data ingestion, and more.

platforms: # The platforms this ROCK should be built on and run on
  amd64:

run_user: _daemon_

environment:
  OPENSEARCH_HOME: /usr/share/opensearch

  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  OPENSEARCH_JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  OPENSEARCH_BIN: /usr/share/opensearch/bin
  OPENSEARCH_LIB: /usr/share/opensearch/lib
  OPENSEARCH_PLUGINS: /usr/share/opensearch/plugins
  OPENSEARCH_MODULES: /usr/share/opensearch/modules

  OPENSEARCH_PATH_CONF: /etc/opensearch
  OPENSEARCH_PATH_CERTS: /etc/opensearch/certificates

  OPENSEARCH_VARLIB: /var/lib/opensearch
  OPENSEARCH_TMPDIR: /usr/share/tmp
  OPENSEARCH_VARLOG: /var/log/opensearch

  KNN_LIB_DIR: /usr/share/opensearch/plugins/opensearch-knn/lib

services:
  opensearch:
    override: replace
    startup: enabled
    summary: Start OpenSearch
    command: '/bin/bash /bin/start.sh'

parts:
  opensearch-snap:
    plugin: nil
    stage-snaps:
      - opensearch/2/edge
    stage-packages:
      - base-files
      - python3-venv
      - python3-yaml
      - curl
      - util-linux
    override-prime: |
      craftctl default

      # opensearch
      mkdir -p data
      mkdir -p extensions

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      # move original plugin and keystore binary
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin.orig" "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin"
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore.orig" "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore"

      ## for deb packages
      dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W > ${rocks}/dpkg.query

      ## for snap packages
      cp snap.opensearch/manifest.yaml ${rocks}
      cp snap.opensearch/snapcraft.yaml ${rocks}

  non-root-user:
    plugin: nil
    after: [opensearch-snap]
    override-prime: |
      craftctl default

      # Ensure _daemon_ user has UID/GID 584792 for Pebble service
      # Pebble's user field requires a username in /etc/passwd, not just a numeric UID
      # _daemon_ is the default run_user, so we ensure it has the correct UID to match file ownership
      # If _daemon_ does not exist or has wrong UID, recreate it with UID 584792
      if ! id -u _daemon_ >/dev/null 2>&1 || [ "$(id -u _daemon_)" != "584792" ]; then
        # Remove existing _daemon_ user/group if it has wrong UID
        userdel _daemon_ 2>/dev/null || true
        groupdel _daemon_ 2>/dev/null || true
        # Create _daemon_ with correct UID/GID
        groupadd -g 584792 _daemon_ || true
        useradd -u 584792 -g 584792 -r -s /bin/false _daemon_ || true
      fi

      # Give permission at the required folders
      mkdir -p var/lib/opensearch usr/share/tmp var/log/opensearch
      
      # Ensure certificates directory exists with correct permissions
      # This directory is used for TLS certificates (*.p12, chain.pem)
      mkdir -p etc/opensearch/certificates
      # Mirror with the snap style: https://github.com/canonical/opensearch-snap/blob/2/edge/snap/hooks/install#L79
      # service user owns the directories/files, group root can also access them when needed.
      chown -R 584792 etc/opensearch opt/opensearch usr/share/opensearch var/lib/opensearch usr/share/tmp var/log/opensearch
      chgrp -R root etc/opensearch opt/opensearch usr/share/opensearch var/lib/opensearch usr/share/tmp var/log/opensearch
      chmod 770 etc/opensearch/certificates


  entry:
    plugin: dump
    source: scripts
    organize:
      start.sh: usr/bin/start.sh
      set_conf.py: usr/bin/set_conf.py
    stage:
      - usr/bin/start.sh
      - usr/bin/set_conf.py
